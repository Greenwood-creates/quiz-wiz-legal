<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz Wizards — Legal &amp; Support</title>
<style>
  :root { --bg:#0B0D1B; --surface:#14172B; --elevated:#1E2240; --gold:#F5C451; --violet:#8B5CF6; --text:#F5F1E6; --muted:#9CA3B8; }
  * { box-sizing: border-box; }
  body { margin:0; background:linear-gradient(180deg,var(--bg),#131028); color:var(--text);
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; min-height:100vh; }
  main { max-width:720px; margin:0 auto; padding:64px 24px; }
  h1 { font-size:42px; letter-spacing:1px;
       background:linear-gradient(90deg,var(--gold),var(--violet));
       -webkit-background-clip:text; background-clip:text; color:transparent; }
  p.sub { color:var(--muted); letter-spacing:3px; text-transform:uppercase; font-size:14px; }
  a.card { display:block; background:var(--surface); border:1px solid var(--elevated);
           border-radius:16px; padding:20px 24px; margin:16px 0; color:var(--text);
           text-decoration:none; font-size:18px; font-weight:600; transition:border-color .15s; }
  a.card:hover { border-color:var(--gold); }
  a.card span { float:right; color:var(--gold); }
  p.contact { color:var(--muted); font-size:14px; margin-top:40px; }
  p.contact a { color:var(--gold); }
</style>
</head>
<body>
<main>
  <h1>Quiz Wizards</h1>
  <p class="sub">forge your knowledge</p>
  <a class="card" href="terms.html">Terms of Service <span>&rarr;</span></a>
  <a class="card" href="privacy.html">Privacy Policy <span>&rarr;</span></a>
  <a class="card" href="support.html">Support <span>&rarr;</span></a>
  <p class="contact">Contact: <a href="mailto:isaiah.greenwood01@gmail.com">isaiah.greenwood01@gmail.com</a></p>
</main>
</body>
</html>
